name: Publish pytspclient

on:
  push:
    tags:
      - 'pytspclient-v*'

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build gtsp binary
        working-directory: gtsp/src
        # CGO_ENABLED=0：发布到 PyPI 的 gtsp 会在不同发行版/容器镜像里执行，
        # 动态链接会绑定构建机 glibc 版本（如 ubuntu:20.04 无法运行）。
        env:
          CGO_ENABLED: '0'
        run: |
          go build -ldflags="-s -w" -o ../dist/gtsp-linux-amd64 main.go
          file ../dist/gtsp-linux-amd64
          file ../dist/gtsp-linux-amd64 | grep -q "statically linked" \
            || { echo "::error::gtsp-linux-amd64 is not statically linked"; exit 1; }

      - name: Test gtsp
        working-directory: gtsp
        run: ./dist/gtsp-linux-amd64 --help

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio

      - name: Run pytspclient tests
        working-directory: client/pytspclient
        env:
          GTSP_PATH: ../../gtsp/dist/gtsp-linux-amd64
        run: python -m pytest tests/ -v

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        working-directory: client/pytspclient
        run: python -m build

      - name: Publish to PyPI
        working-directory: client/pytspclient
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*